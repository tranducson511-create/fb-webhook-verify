<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Admin TaiwanPay V5</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Admin V5 - Hàng đợi đơn</h1>
  <div class="admin-queue" id="queue">
    <!-- Orders sorted by urgency: overdue, near expiry, waiting code, customer reported -->
    <div class="order-row">
      <span class="order-id">ORD-001</span>
      <span>Quá hạn</span>
      <button>Tạo TwPay Card</button>
    </div>
    <!-- More dynamic rows -->
  </div>
  <div class="three-col">
    <div>Cột 1: Thông tin đơn</div>
    <div>Cột 2: Ảnh gốc + watermark go-vn (chỉ admin)</div>
    <div>Cột 3: Hành động</div>
  </div>
  <div>
    <p>Trên phiếu: 19:50 / Hết hạn: 10:50</p>
    <button>Trừ 2 phút</button>
    <button id="sendBtn">Gửi (việc còn thiếu hiện ở đây)</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
